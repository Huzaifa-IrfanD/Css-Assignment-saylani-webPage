<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- max-container -->
    <div class="max-container">
      <div class="header">
        <!-- saylani nav logo -->
        <div class="smit-logo">
          <img
            src="./images/sit-logo.png"
            alt="SMIT sit-logo"
            class="sit-logo"
          />
        </div>
        <div class="nav-text">
          <nav>
            <a href="#" class="nav-texts">Home</a>
            <a href="#" class="nav-texts">About</a>
            <a href="#" class="nav-texts"
              >Courses
              <svg
                class="Courses-svg"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </a>
            <a href="#" class="nav-texts">Campuses</a>
            <a href="#" class="nav-texts">Check Result</a>

            <button class="enroll-btn">
              Enroll Now
              <svg
                class="enroll-svg"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </button>
            <div class="menu-btn">
              <button>
                <svg
                  class="menuBtn-svg"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.75 6.75h16.5M3.75 12h16.5M12 17.25h8.25"
                  />
                </svg>
              </button>
            </div>
          </nav>
        </div>
      </div>

      <!-- message icon -->

      <div class="message-icon-svg">
        <svg
          class="message-svg"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 0 1-.923 1.785A5.969 5.969 0 0 0 6 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337Z"
          />
        </svg>
      </div>
      <!-- bulding pakistan -->
      <div class="building-pakistan">
        <div class="build">
          <img
            src="./images/laptop_icon.webp"
            alt=""
            height="100"
            width="110px"
            class="laptop-icon"
          />
          <img
            src="./images/up_arrow.webp"
            alt=""
            height="100px"
            width="190px"
            class="up-arrow"
          />

          <img
            src="./images/down_arrow.webp"
            alt=""
            height="100px"
            width="180px"
            class="down-arrow"
          />

          <img
            src="./images/globe_icon.webp"
            alt=""
            height="130px"
            width="100px"
            class="globe-icon"
          />

          <h1>Building Pakistan's</h1>
          <h1 class="h1-blue">Tech Future</h1>
          <p>Changing Lives. Building Careers. Shaping the Future.</p>
          <img
            src="./images/saylani_logo.webp"
            alt=""
            height="36.25px"
            width="160"
            class="saylani-logo"
          />
          <div class="hero-btns">
            <button class="Enroll-btn2">ENROLL NOW</button>
            <button class="explore-btn">EXPLORE Courses</button>
          </div>
        </div>
      </div>
      <!-- card  -->
      <div class="card-or-video">
        <img
          src="./images/shahmeerrizwan.webp"
          alt=""
          height="250"
          width="242.63"
          class="img-1"
        />
        <iframe
          class="youtube-video"
          width="317.93"
          height="220"
          src="https://www.youtube.com/embed/M7lc1UVf-VE"
          allowfullscreen
        >
        </iframe>
        <img
          src="./images/home_girl.svg"
          alt=""
          height="270"
          width="242.63"
          class="img-2"
        />
      </div>
    </div>
  </body>
</html>
